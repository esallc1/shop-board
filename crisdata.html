<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>CrisData — Lee Transmission</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5b5ef4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CrisData">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="/shared/pwa-register.js"></script>
<script src="/shared/version-check.js"></script>
<style>
  :root{
    --accent:#2a4fe0;
    --accent-2:#3d6bff;
    --gold:#ffd21e;
    --text:#eef1f8;
    --muted:#9aa4bd;
    --danger:#ff6b6b;
    --card-border:rgba(255,255,255,.16);
    --field-bg:rgba(255,255,255,.09);
    --field-border:rgba(255,255,255,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  /* Full-viewport shop photo, slightly scaled */
  body::before{
    content:''; position:fixed; inset:0; z-index:-2;
    background:url('assets/shop-bg.jpg') center center / cover no-repeat;
    transform:scale(1.03);
  }
  /* Neutral darkening + inset vignette — keep the photo clearly visible */
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:linear-gradient(180deg, rgba(6,9,18,.34), rgba(6,9,18,.52) 60%, rgba(6,9,18,.66));
    box-shadow: inset 0 0 240px rgba(0,0,0,.6);
  }

  /* Fixed top bar + footer over the photo */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 26px; font-size:14px; text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .topbar .wordmark{ font-weight:800; letter-spacing:.02em; color:#fff; }
  .topbar .wordmark .gold{ color:var(--gold); }
  .topbar .topbar-right{ color:var(--muted); font-weight:600; }
  .footer{
    position:fixed; left:0; right:0; bottom:0; z-index:2; text-align:center;
    padding:16px; font-size:12.5px; color:var(--muted); text-shadow:0 1px 3px rgba(0,0,0,.6);
  }

  /* Frosted login card */
  .card{
    position:relative; z-index:1; width:100%; max-width:412px;
    background:linear-gradient(180deg, rgba(12,16,32,.82), rgba(8,11,24,.9));
    border:1px solid var(--card-border);
    border-radius:24px;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.03);
    padding:38px 34px 30px;
  }

  /* Card hero: logo with a soft blue radial glow behind it */
  .hero{ position:relative; text-align:center; margin-bottom:14px; }
  .hero::before{
    content:''; position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:260px; height:150px; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(61,107,255,.45), rgba(61,107,255,0) 70%);
    filter:blur(6px);
  }
  .logo{
    position:relative; z-index:1; width:230px; max-width:80%; height:auto;
    display:block; margin:0 auto;
    /* The logo PNG has a baked-in black backdrop; screen blend drops the black to
       transparent against the dark card, leaving the logo floating in the glow. */
    mix-blend-mode:screen;
  }
  .card-title{ text-align:center; font-size:22px; font-weight:800; color:#fff; margin-top:4px; }
  .card-sub{ text-align:center; font-size:13.5px; color:var(--muted); margin:6px 0 24px; }

  /* Fallback text brand (loading / notice states) */
  .brand{ text-align:center; margin-bottom:22px; }
  .brand h1{ font-size:22px; font-weight:800; color:#fff; }
  .brand h1 span{ color:var(--gold); }
  .brand p{ font-size:13px; color:var(--muted); margin-top:6px; }

  .field{ margin-bottom:15px; }
  .field label{
    display:block; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--muted); margin-bottom:7px;
  }
  .field input{
    width:100%; background:var(--field-bg); border:1px solid var(--field-border);
    border-radius:12px; padding:13px 15px; font-size:16px; color:var(--text);
    outline:none; font-family:inherit; transition:border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .field input::placeholder{ color:rgba(255,255,255,.4); }
  .field input:focus{
    border-color:var(--accent-2); background:rgba(255,255,255,.13);
    box-shadow:0 0 0 3px rgba(61,107,255,.35);
  }

  /* Keep-me-signed-in + reset-password row */
  .row{ display:flex; align-items:center; justify-content:space-between; margin:4px 0 18px; font-size:13px; }
  .checkbox{ display:flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer; user-select:none; }
  .checkbox input{ width:15px; height:15px; accent-color:var(--accent-2); }
  .reset-link{ color:var(--accent-2); text-decoration:none; font-weight:600; }
  .reset-link:hover{ text-decoration:underline; }

  .error{ color:var(--danger); font-size:13px; text-align:center; min-height:18px; margin-bottom:8px; }

  .btn{
    width:100%; background:linear-gradient(135deg,#2a4fe0,#3d6bff); color:#fff; border:none;
    border-radius:12px; padding:14px; font-size:15px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 10px 24px rgba(42,79,224,.4); transition:filter 0.15s, transform 0.05s;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:0.6; cursor:default; box-shadow:none; }
  .btn-arrow{ color:var(--gold); font-size:17px; font-weight:800; line-height:1; }

  .redirect-note{
    text-align:center; font-size:12.5px; color:var(--muted); margin-top:16px; line-height:1.5;
  }
  .redirect-note a{ color:var(--accent-2); text-decoration:none; }

  /* Interstitial ("taking you to your board…") */
  .success-panel{ text-align:center; }
  .success-panel .check{
    width:56px; height:56px; border-radius:50%;
    background:rgba(61,107,255,.18); border:1px solid rgba(61,107,255,.4);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
    font-size:26px; color:var(--accent-2);
  }
  .success-panel h2{ font-size:19px; color:#fff; margin-bottom:6px; }
  .success-panel p{ font-size:13px; color:var(--muted); }

  @media (max-width:480px){
    .card{ max-width:100%; padding:32px 22px 26px; }
    .logo{ width:200px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabase-config.js"></script>
<script src="shared/office-identity.js"></script>
</head>
<body>

<div class="topbar">
  <span class="wordmark">Cris<span class="gold">Data</span></span>
  <span class="topbar-right">Staff sign-in</span>
</div>

<div class="card" id="cardRoot"></div>

<div class="footer">Lee Transmission · Staff Portal</div>

<script>
const ROLE_LABEL = { tech:'Technician', advisor:'Service Advisor', manager:'Manager', owner:'Owner', bookkeeping:'Bookkeeping' };
const ROLE_DEST  = { tech:'my-numbers.html', advisor:'advisor-board.html', manager:'gm-board.html', owner:'owner-board.html', bookkeeping:'bookkeeping-board.html' };

/* ---------------- Supabase ---------------- */
const { url: SUPABASE_URL, key: SUPABASE_KEY } = window.cdSupabaseCreds();
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,       // session survives reloads (localStorage) — same as office-login.html
    autoRefreshToken: true,     // keep the access token fresh
    detectSessionInUrl: true,   // consume any invite/recovery hash if a link ever lands here
  },
});

/* ============================================================
   SINGLE FRONT DOOR (office-auth §8.6d) — one door, email + password,
   auto-routed to the caller's board by role via ROLE_DEST.

   The old phone/PIN form (render()/doLogin()) was DELETED 2026-09-17: it was
   never shown, and it was the only code that put a PIN into a URL
   (?u=phone&p=pin) on the way to a board. Techs sign in on my-numbers.html's
   own PIN screen; the tech login moves to a real Supabase session later.

   IMPORTANT: this page uses db.auth.getSession() DIRECTLY and never calls
   OfficeIdentity.resolve(). resolve() auto-arms the shared 120-min idle
   auto-logout, which redirects to crisdata.html — the door must never arm
   a timer that would redirect to itself. (office-identity.js is included
   for parity/future use, but the door does not invoke it.)
   ============================================================ */
let DOOR = { email:'', password:'', error:'', loading:false };
const doorCard = document.getElementById('cardRoot');
let interstitialTimer = null;

function escHtml(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Only route to a role that has a real board — never redirect to undefined.
function boardFor(role){ return role && Object.prototype.hasOwnProperty.call(ROLE_DEST, role) ? ROLE_DEST[role] : null; }

const DOOR_BRAND = `<div class="hero"><img class="logo" src="assets/lee-logo.png" alt="Lee Transmission"></div>`;

function renderDoorLoading(){
  doorCard.innerHTML = `${DOOR_BRAND}<p class="redirect-note">Checking your session…</p>`;
}

function renderDoorLogin(){
  doorCard.innerHTML = `
    ${DOOR_BRAND}
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to continue</p>
    <div class="field">
      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" autocomplete="username" placeholder="you@leetransmissionauto.com" value="${escHtml(DOOR.email)}">
    </div>
    <div class="field">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" autocomplete="current-password" placeholder="Your password" value="${escHtml(DOOR.password)}">
    </div>
    <div class="row">
      <label class="checkbox"><input type="checkbox" id="keepSignedIn" checked> Keep me signed in</label>
      <a class="reset-link" href="office-login.html">Reset password</a>
    </div>
    <div class="error">${escHtml(DOOR.error)}</div>
    <button class="btn" id="signInBtn" ${DOOR.loading ? 'disabled' : ''}>${DOOR.loading ? 'Signing in…' : 'Sign in <span class="btn-arrow">→</span>'}</button>
  `;
  const emailEl = document.getElementById('emailInput');
  const pwEl = document.getElementById('passwordInput');
  emailEl.addEventListener('input', e => { DOOR.email = e.target.value; });
  pwEl.addEventListener('input', e => { DOOR.password = e.target.value; });
  pwEl.addEventListener('keydown', e => { if(e.key === 'Enter') doorSignIn(); });
  document.getElementById('signInBtn').addEventListener('click', doorSignIn);
}

// Signed in but nothing to route to (unlinked account, or a role with no board).
function renderDoorNotice(msg){
  doorCard.innerHTML = `
    ${DOOR_BRAND}
    <p class="redirect-note">${escHtml(msg)}</p>
    <button class="btn" id="noticeSignOut" style="margin-top:16px">Sign out</button>
  `;
  document.getElementById('noticeSignOut').addEventListener('click', doorSignOut);
}

// Brief "taking you to your board…" with an escape hatch, then redirect.
function renderDoorInterstitial(emp, returning){
  const label = ROLE_LABEL[emp.role] || emp.role || '';
  doorCard.innerHTML = `
    <div class="success-panel">
      <div class="check">✓</div>
      <h2>${returning ? 'Welcome back' : 'Welcome'}, ${escHtml(emp.name)}</h2>
      <p>${escHtml(label)} — taking you to your board…</p>
    </div>
    <button class="btn" id="notYouBtn" style="background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:20px">Not you? Sign out</button>
  `;
  document.getElementById('notYouBtn').addEventListener('click', () => {
    if(interstitialTimer){ clearTimeout(interstitialTimer); interstitialTimer = null; }
    doorSignOut();
  });
  interstitialTimer = setTimeout(() => { window.location.href = boardFor(emp.role); }, 3000);
}

async function doorSignOut(){
  try { await db.auth.signOut(); } catch (e) {}
  DOOR.email = ''; DOOR.password = ''; DOOR.error = '';
  renderDoorLogin();
}

// Decide what a signed-in session should do: route to its board, or explain.
async function doorRouteOrExplain(session, returning){
  const user = session && session.user;
  if(!user){ renderDoorLogin(); return; }
  const { data: emp, error } = await db
    .from('employees').select('name, role').eq('auth_user_id', user.id).maybeSingle();
  if(error){ DOOR.error = 'Could not verify your account — check your connection and try again.'; renderDoorLogin(); return; }
  if(!emp){ renderDoorNotice("You’re signed in, but your account isn’t linked yet — ask Cristian to finish setup."); return; }
  if(!boardFor(emp.role)){ renderDoorNotice(`You’re signed in as ${emp.name}, but your role isn’t set up with a board yet — ask Cristian.`); return; }
  renderDoorInterstitial(emp, returning);
}

async function doorSignIn(){
  if(DOOR.loading) return;
  const email = DOOR.email.trim(); const password = DOOR.password;
  if(!email || !password){ DOOR.error = 'Enter your email and password.'; renderDoorLogin(); return; }
  DOOR.loading = true; DOOR.error = ''; renderDoorLogin();
  const { error } = await db.auth.signInWithPassword({ email, password });
  DOOR.loading = false;
  if(error){ DOOR.error = error.message || 'Could not sign in — check your email and password.'; renderDoorLogin(); return; }
  const { data: { session } } = await db.auth.getSession();
  await doorRouteOrExplain(session, false);
}

// On load: check for an existing session WITHOUT arming any idle timer.
async function bootDoor(){
  renderDoorLoading();
  let session = null;
  try { const r = await db.auth.getSession(); session = r.data.session; } catch (e) { session = null; }
  if(session && session.user){ await doorRouteOrExplain(session, true); }
  else { renderDoorLogin(); }
}

bootDoor();
</script>
</body>
</html>
